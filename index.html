<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick quiz</title>
<meta name="theme-color" content="#FFE45E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFE45E;
    --ink: #1B1F3B;
    --pink: #FF5D8F;
    --mint: #7FE0C3;
    --paper: #FFFFFF;
    --font: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--sun);
    color: var(--ink);
    font-family: var(--font);
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  .blob { position: fixed; border-radius: 50%; z-index: 0; pointer-events: none; }
  .blob.a { width: 220px; height: 220px; background: var(--mint); top: -70px; right: -60px; }
  .blob.b { width: 150px; height: 150px; background: var(--pink); bottom: -50px; left: -40px; }

  main { position: relative; z-index: 1; width: 100%; max-width: 520px; text-align: center; }
  .screen[hidden] { display: none; }
  .screen { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.94) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  .hi { font-size: 1.1rem; font-weight: 700; margin: 0 0 .5rem; }
  h1 {
    font-size: clamp(2.2rem, 10vw, 3.6rem);
    line-height: 1.04;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 1rem;
    outline: none;
  }
  h1.q { font-size: clamp(1.8rem, 8vw, 2.8rem); }
  .sub { font-size: 1.15rem; line-height: 1.4; margin: 0 auto 2rem; max-width: 30ch; }

  .btn {
    font: inherit; font-weight: 800; color: var(--ink);
    border: 3px solid var(--ink); border-radius: 18px;
    background: var(--paper);
    padding: .8rem 1.4rem; font-size: 1.05rem;
    box-shadow: 0 5px 0 var(--ink);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s, background .1s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 0 var(--ink); }
  .btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--ink); }
  .btn:focus-visible, .chip:focus-visible, .link:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
  .btn[disabled] { cursor: default; }
  .btn[disabled]:not(.picked) { opacity: .5; transform: none; box-shadow: 0 5px 0 var(--ink); }
  .btn.picked { background: var(--mint); transform: rotate(-1.5deg) scale(1.03); }

  .yes {
    background: var(--pink); color: #fff;
    font-size: clamp(1.4rem, 6vw, 2rem);
    padding: 1rem 2.4rem; border-radius: 26px;
  }
  .wiggle { animation: wiggle 2.4s ease-in-out 1s 2; }
  @keyframes wiggle { 0%,100% { rotate: 0deg; } 8% { rotate: -3deg; } 16% { rotate: 3deg; } 24% { rotate: -2deg; } 32% { rotate: 0deg; } }

  .opts { display: grid; gap: 14px; max-width: 380px; margin: 0 auto; }
  .opts .btn { width: 100%; }
  .react { min-height: 1.6em; margin: 1.4rem 0 0; font-weight: 700; font-size: 1.1rem; }

  .dots { display: flex; gap: 10px; justify-content: center; margin: 0 0 1.6rem; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); background: transparent; }
  .dot.done { background: var(--ink); }
  .dot.now { background: var(--pink); }

  .row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 1.6rem; }

  .chips { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 0 0 1.8rem; }
  .chip {
    font: inherit; font-weight: 700; color: var(--ink);
    background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
    padding: .55rem 1.1rem; cursor: pointer; transition: background .1s, transform .1s;
  }
  .chip[aria-pressed="true"] { background: var(--mint); transform: rotate(-2deg) scale(1.05); }

  .small { font-size: .95rem; margin-top: 1.4rem; }
  .link { background: none; border: 0; font: inherit; font-weight: 700; color: var(--ink); text-decoration: underline; cursor: pointer; padding: 4px; }
  .quiet { opacity: .75; font-weight: 400; }
  .emoji { font-size: 3.4rem; display: block; margin-bottom: .6rem; }

  /* pink roses */
  #roses { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  .rose-fall { position: absolute; top: -80px; animation: rose-fall linear forwards; will-change: transform; }
  @keyframes rose-fall {
    0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    50%  { transform: translate3d(var(--sway), 55vh, 0) rotate(calc(var(--spin) / 2)); }
    100% { transform: translate3d(calc(var(--sway) * -1), 112vh, 0) rotate(var(--spin)); opacity: 1; }
  }
  .bouquet { display: flex; justify-content: center; align-items: flex-end; margin: 0 0 .8rem; height: 96px; }
  .bouquet svg { width: 72px; height: 72px; }
  .bouquet svg:nth-child(1) { rotate: -18deg; margin-right: -14px; }
  .bouquet svg:nth-child(2) { width: 92px; height: 92px; z-index: 1; }
  .bouquet svg:nth-child(3) { rotate: 18deg; margin-left: -14px; }

  canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  @media (prefers-reduced-motion: reduce) {
    .screen, .wiggle { animation: none; }
    #roses { display: none; }
    .btn, .chip { transition: none; }
  }
</style>
</head>
<body>
<div class="blob a" aria-hidden="true"></div>
<div class="blob b" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="rose" viewBox="0 0 64 64">
    <path d="M32 36 C32 46 31 54 30 63" fill="none" stroke="#1B1F3B" stroke-width="3" stroke-linecap="round"/>
    <path d="M31 52 C22 52 16 46 15 41 C24 40 30 44 31 52 Z" fill="#7FE0C3" stroke="#1B1F3B" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="32" cy="22" r="18" fill="#FF8DB4" stroke="#1B1F3B" stroke-width="3"/>
    <circle cx="32" cy="22" r="11.5" fill="#FF5D8F" stroke="#1B1F3B" stroke-width="3"/>
    <path d="M32 22 m-4.5 0 a4.5 4.5 0 1 1 4.5 4.5" fill="none" stroke="#1B1F3B" stroke-width="3" stroke-linecap="round"/>
  </symbol>
</svg>
<div id="roses" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main>
  <!-- Intro -->
  <section class="screen" id="intro">
    <p class="hi" id="hi"></p>
    <h1>I made you a tiny quiz.</h1>
    <p class="sub" id="introSub"></p>
    <button class="btn yes wiggle" id="start">Start</button>
  </section>

  <!-- Quiz questions (reused for each question) -->
  <section class="screen" id="quiz" hidden>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <h1 class="q" id="qText"></h1>
    <div class="opts" id="opts"></div>
    <p class="react" id="react" aria-live="polite"></p>
  </section>

  <!-- Final question -->
  <section class="screen" id="final" hidden>
    <div class="dots" id="dots2" aria-hidden="true"></div>
    <h1 class="q">Last one. Would you rather…</h1>
    <div class="opts">
      <button class="btn yes" id="froyo"></button>
      <button class="btn" id="other">The other option</button>
    </div>
    <p class="small"><button class="link quiet" id="no">Not this time</button></p>
  </section>

  <!-- The other option loops back to yes -->
  <section class="screen" id="twist" hidden>
    <span class="emoji" aria-hidden="true">😏</span>
    <h1>Plot twist.</h1>
    <p class="sub" id="twistSub"></p>
    <button class="btn yes" id="yes2">Fine, yes</button>
  </section>

  <!-- Pick a day -->
  <section class="screen" id="pick" hidden>
    <span class="emoji" aria-hidden="true">🎉</span>
    <h1>Yay. Pick a day.</h1>
    <p class="sub">Choose what works and I'll text you to lock it in.</p>
    <div class="chips" id="chips" role="group" aria-label="Pick a day"></div>
    <button class="btn" id="send" disabled>Send my answer</button>
  </section>

  <!-- Sent -->
  <section class="screen" id="done" hidden>
    <div class="bouquet" aria-hidden="true">
      <svg viewBox="0 0 64 64"><use href="#rose"/></svg>
      <svg viewBox="0 0 64 64"><use href="#rose"/></svg>
      <svg viewBox="0 0 64 64"><use href="#rose"/></svg>
    </div>
    <h1>It's a date.</h1>
    <p class="sub" id="doneSub"></p>
    <p class="small" id="copyRow" hidden>Didn't open? <button class="link" id="copy">Copy the message</button></p>
  </section>

  <!-- Graceful no -->
  <section class="screen" id="nope" hidden>
    <span class="emoji" aria-hidden="true">🫶</span>
    <h1>All good, really.</h1>
    <p class="sub" id="nopeText"></p>
  </section>
</main>

<script>
/* ============ EDIT THIS PART ============ */
const CONFIG = {
  theirName: "Ireland",
  myName:    "Kyle",
  activity:  "froyo",
  // Instant notification to YOUR phone when she answers (free, no signup).
  // 1) Install the "ntfy" app  2) Subscribe to a topic name  3) Put that exact name here.
  // Make it long and random so nobody else can guess it, e.g. "froyo-ireland-k7x92qpl3m".
  ntfyTopic: "ntfy.sh/froyo1738",
  trackEachStep: true,   // true = a notification for the link opening and for every answer, live. false = only the final yes/no.
  // Optional: opens a pre-filled text TO you on her phone. Your number would be public in the repo, so leaving this empty is safer.
  phone:     "",
  days: ["This Friday", "This Saturday", "Next week", "Surprise me"],

  // r = the little reaction shown after she picks an answer
  questions: [
    { q: "Pick a superpower.",
      opts: [
        { t: "Teleport anywhere",     r: "Bold. I respect it." },
        { t: "Pause time",            r: "Smart. Naps for days." },
        { t: "Talk to animals",       r: "Best answer. Every dog has opinions." }
      ] },
    { q: "Pick a vibe for a perfect Saturday.",
      opts: [
        { t: "Cozy and chill",              r: "Elite taste." },
        { t: "Spontaneous adventure",       r: "Love that energy." },
        { t: "Good food, good people",      r: "Okay, we're getting somewhere." }
      ] },
    { q: "Sweet or salty?",
      opts: [
        { t: "Sweet",                r: "Correct. Next." },
        { t: "Salty",                r: "Fair. We'll work with it." },
        { t: "Both, obviously",      r: "A person of culture." }
      ] },
    { q: "Pick your dessert style.",
      opts: [
        { t: "Chaotic, every topping",        r: "Noted. I'd expect nothing less." },
        { t: "Classic and simple",            r: "Clean. Confident. Noted." },
        { t: "Surprise me",                   r: "Dangerous. I like it." }
      ] }
  ],

  froyoButton: "Get froyo with me",
  twistText:   "The other option is also froyo with me. You were always going to say yes.",
  yesMessage:  (day, answers) => `Hey it's ${CONFIG.myName}! You said yes on the website, so ${day} works for ${CONFIG.activity}. 😄 Your quiz answers: ${answers.join(", ")}.`,
  noMessage:   "Thanks for being honest. Still think you're great, and no weirdness on my end."
};
/* ======================================== */

const $ = (id) => document.getElementById(id);
const screens = ["intro", "quiz", "final", "twist", "pick", "done", "nope"];
function show(id) {
  screens.forEach((s) => { $(s).hidden = s !== id; });
  const h = $(id).querySelector("h1");
  if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
}

// Static copy
$("hi").textContent = `Hey ${CONFIG.theirName}.`;
$("introSub").textContent = `${CONFIG.questions.length} questions. No wrong answers. Probably.`;
$("froyo").textContent = CONFIG.froyoButton;
$("twistSub").textContent = CONFIG.twistText;
$("nopeText").textContent = CONFIG.noMessage;

// Progress dots (quiz questions + the final one)
const total = CONFIG.questions.length + 1;
function drawDots(el, current) {
  el.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const d = document.createElement("span");
    d.className = "dot" + (i < current ? " done" : i === current ? " now" : "");
    el.appendChild(d);
  }
}

// Quiz flow
let qi = 0;
const answers = [];

function renderQuestion() {
  const item = CONFIG.questions[qi];
  $("qText").textContent = item.q;
  $("react").textContent = "";
  drawDots($("dots"), qi);
  const box = $("opts");
  box.innerHTML = "";
  item.opts.forEach((o) => {
    const b = document.createElement("button");
    b.className = "btn"; b.type = "button"; b.textContent = o.t;
    b.addEventListener("click", () => choose(b, o));
    box.appendChild(b);
  });
  show("quiz");
}

function choose(btn, opt) {
  answers.push(opt.t);
  notifyStep(CONFIG.theirName + " - Q" + (qi + 1) + " of " + total, CONFIG.questions[qi].q + "  ->  " + opt.t);
  document.querySelectorAll("#opts .btn").forEach((b) => { b.disabled = true; });
  btn.classList.add("picked");
  $("react").textContent = opt.r;
  setTimeout(() => {
    qi++;
    if (qi < CONFIG.questions.length) renderQuestion();
    else { drawDots($("dots2"), CONFIG.questions.length); show("final"); }
  }, 1100);
}

$("start").addEventListener("click", renderQuestion);
notifyStep(CONFIG.theirName + " opened it", "Someone just opened the link (this also fires when you test it).");

// Confetti (skipped if the person prefers reduced motion)
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const colors = ["#FF5D8F", "#7FE0C3", "#1B1F3B", "#FFFFFF", "#FFB703"];
  const bits = Array.from({ length: 140 }, () => ({
    x: innerWidth / 2, y: innerHeight * 0.6,
    vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 4,
    s: Math.random() * 8 + 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
    col: colors[Math.floor(Math.random() * colors.length)]
  }));
  let frames = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bits.forEach((p) => {
      p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (++frames < 160) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

// Day picker
let chosen = null;
CONFIG.days.forEach((d) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = d; b.setAttribute("aria-pressed", "false");
  b.addEventListener("click", () => {
    chosen = d;
    document.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
    $("send").disabled = false;
  });
  $("chips").appendChild(b);
});

// Push a notification to Kyle's phone via ntfy (fails silently if not configured)
function notify(title, body, tag) {
  if (!CONFIG.ntfyTopic) return;
  try {
    fetch("https://ntfy.sh/" + encodeURIComponent(CONFIG.ntfyTopic), {
      method: "POST",
      body,
      headers: { Title: title, Tags: tag || "tada" },
      keepalive: true
    }).catch(() => {});
  } catch (e) {}
}

// Pink roses rain down the screen (skipped if the person prefers reduced motion)
function rainRoses(count) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = $("roses");
  for (let i = 0; i < count; i++) {
    const size = 30 + Math.random() * 34;
    const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    el.setAttribute("viewBox", "0 0 64 64");
    el.setAttribute("width", size); el.setAttribute("height", size);
    el.setAttribute("class", "rose-fall");
    el.innerHTML = '<use href="#rose"/>';
    const dur = 3.8 + Math.random() * 2.4;
    el.style.left = (Math.random() * 100) + "%";
    el.style.animationDuration = dur + "s";
    el.style.animationDelay = (Math.random() * 1.4) + "s";
    el.style.setProperty("--sway", (Math.random() * 90 - 45) + "px");
    el.style.setProperty("--spin", (Math.random() * 540 - 270) + "deg");
    box.appendChild(el);
    setTimeout(() => el.remove(), (dur + 1.6) * 1000 + 200);
  }
}

function notifyStep(title, body) { if (CONFIG.trackEachStep) notify(title, body, "speech_balloon"); }

function sayYes() { show("pick"); confetti(); rainRoses(26); }

$("froyo").addEventListener("click", () => {
  notifyStep(CONFIG.theirName + " - final question", "She picked: " + CONFIG.froyoButton);
  sayYes();
});
$("other").addEventListener("click", () => {
  notifyStep(CONFIG.theirName + " - final question", "She picked: The other option (plot twist screen)");
  show("twist");   // the other option leads back to yes
});
$("yes2").addEventListener("click", sayYes);
$("no").addEventListener("click", () => {
  show("nope");
  notify(CONFIG.theirName + " answered", "She picked 'Not this time'. Quiz answers: " + (answers.join(", ") || "none"), "wave");
});

$("send").addEventListener("click", () => {
  show("done");
  confetti();
  rainRoses(18);
  $("doneSub").textContent = CONFIG.phone
    ? "Your text should be open now. Hit send and I'll take it from here."
    : "Sent! I just got your answer. I'll text you the details.";
  $("copyRow").hidden = !CONFIG.phone;
  notify(CONFIG.theirName + " said YES", chosen + " for " + CONFIG.activity + ". Quiz answers: " + answers.join(", "), "tada");
  if (CONFIG.phone) {
    location.href = `sms:${CONFIG.phone}?&body=${encodeURIComponent(CONFIG.yesMessage(chosen, answers))}`;
  }
});

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(CONFIG.yesMessage(chosen, answers)); $("copy").textContent = "Copied!"; }
  catch { $("copy").textContent = "Couldn't copy, sorry"; }
});
</script>
</body>
</html>
